<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Гарри — дашборд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #7d7d7d);
    --link: var(--tg-theme-link-color, #cc8b3c);
    --accent: var(--tg-theme-button-color, #cc8b3c);
    --section-bg: var(--tg-theme-secondary-bg-color, #f4f4f2);
    --rule: color-mix(in srgb, var(--hint) 25%, transparent);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 0 2rem;
  }
  header {
    padding: 1.1rem 1rem 0.9rem;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  header h1 {
    font-size: 1.3rem;
    margin: 0 0 0.15rem;
    font-weight: 700;
  }
  header p {
    margin: 0;
    color: var(--hint);
    font-size: 0.85rem;
  }
  .tabs {
    display: flex;
    gap: 0.4rem;
    padding: 0.6rem 1rem 0;
    overflow-x: auto;
  }
  .tab {
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.4rem 0.85rem;
    border-radius: 99px;
    background: var(--section-bg);
    color: var(--hint);
    white-space: nowrap;
    border: none;
  }
  .tab.active { background: var(--accent); color: #fff; }

  main { padding: 0.6rem 1rem; }

  .day-group { margin-bottom: 1.1rem; }
  .day-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--hint);
    margin: 0 0 0.45rem 0.2rem;
  }
  .event-card {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    background: var(--section-bg);
    border-radius: 12px;
    padding: 0.7rem 0.85rem;
    margin-bottom: 0.5rem;
  }
  .event-icon {
    font-size: 1.3rem;
    flex-shrink: 0;
    width: 2.1rem;
    height: 2.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border-radius: 50%;
  }
  .event-body { flex: 1; min-width: 0; }
  .event-title {
    font-size: 0.95rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .event-meta {
    font-size: 0.78rem;
    color: var(--hint);
    margin-top: 0.1rem;
  }
  .event-time {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--link);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .recur-badge {
    font-size: 0.68rem;
    color: var(--hint);
    margin-left: 0.3em;
  }

  .empty, .loading, .error {
    text-align: center;
    color: var(--hint);
    padding: 3rem 1rem;
    font-size: 0.9rem;
  }
  .error { color: #c0503f; }

  .spinner {
    width: 22px; height: 22px;
    border: 2.5px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 0.8rem;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }

  /* Калории */
  .stat-row {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
  }
  .stat-tile {
    flex: 1;
    background: var(--section-bg);
    border-radius: 12px;
    padding: 0.7rem 0.8rem;
  }
  .stat-tile .stat-value {
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .stat-label {
    font-size: 0.72rem;
    color: var(--hint);
    margin-top: 0.1rem;
  }
  .chart-wrap {
    background: var(--section-bg);
    border-radius: 12px;
    padding: 1rem 0.9rem 0.7rem;
    margin-bottom: 1rem;
  }
  .chart-title {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.7rem;
  }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 0.55rem;
    height: 120px;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .bar-val {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.25rem;
    font-variant-numeric: tabular-nums;
  }
  .bar {
    width: 100%;
    max-width: 26px;
    background: var(--accent);
    border-radius: 5px 5px 0 0;
    min-height: 3px;
  }
  .bar-day {
    font-size: 0.66rem;
    color: var(--hint);
    margin-top: 0.35rem;
    text-transform: capitalize;
  }

  /* Планы */
  .plan-section { margin-bottom: 1.3rem; }
  .plan-heading {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--hint);
    margin: 0 0 0.5rem 0.2rem;
  }
  .plan-item {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    background: var(--section-bg);
    border-radius: 12px;
    padding: 0.65rem 0.85rem;
    margin-bottom: 0.4rem;
    cursor: pointer;
    border: none;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .plan-check {
    flex-shrink: 0;
    width: 1.35rem;
    height: 1.35rem;
    border-radius: 50%;
    border: 2px solid var(--hint);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    transition: background 0.15s, border-color 0.15s;
  }
  .plan-item.done .plan-check {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .plan-text {
    font-size: 0.92rem;
    flex: 1;
  }
  .plan-item.done .plan-text {
    color: var(--hint);
    text-decoration: line-through;
  }

  /* Финансы */
  .stat-tile.income .stat-value { color: var(--sage, #4f7d59); }
  .stat-tile.expense .stat-value { color: var(--clay, #a34a37); }
  .stat-tile.net .stat-value.negative { color: var(--clay, #a34a37); }

  .cat-row {
    margin-bottom: 0.65rem;
  }
  .cat-row:last-child { margin-bottom: 0; }
  .cat-row-top {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    margin-bottom: 0.3rem;
  }
  .cat-name { text-transform: capitalize; }
  .cat-amount { font-weight: 600; font-variant-numeric: tabular-nums; }
  .cat-track {
    height: 6px;
    background: var(--bg);
    border-radius: 99px;
    overflow: hidden;
  }
  .cat-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
  }

  .txn-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .txn-row:last-child { border-bottom: none; }
  .txn-body { flex: 1; min-width: 0; }
  .txn-cat {
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: capitalize;
  }
  .txn-meta {
    font-size: 0.76rem;
    color: var(--hint);
    margin-top: 0.1rem;
  }
  .txn-amount {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .txn-amount.income { color: var(--sage, #4f7d59); }
  .txn-amount.expense { color: var(--text); }

  /* Вес/активность */
  .line-chart { width: 100%; height: 130px; display: block; }
  .line-chart .line-path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .line-chart .line-fill { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
  .line-chart .line-dot { fill: var(--accent); }
  .line-chart .line-dot.last { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
  .line-chart .line-grid { stroke: var(--rule); stroke-width: 1; }
  .steps-bars .bar { background: var(--sage, #4f7d59); }

  /* Вишлист */
  .wish-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
  }
  .wish-card {
    background: var(--section-bg);
    border-radius: 12px;
    overflow: hidden;
  }
  .wish-photo {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--bg);
    display: block;
  }
  .wish-photo-empty {
    width: 100%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    background: var(--bg);
  }
  .wish-body { padding: 0.6rem 0.7rem 0.75rem; }
  .wish-title {
    font-size: 0.85rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    line-height: 1.3;
    min-height: 2.2em;
  }
  .wish-price {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--link);
    margin-top: 0.3rem;
  }
  .wish-priority {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 0.15em 0.5em;
    border-radius: 99px;
    background: var(--bg);
    color: var(--hint);
    margin-top: 0.35rem;
    text-transform: capitalize;
  }
  .wish-link {
    display: block;
    margin-top: 0.4rem;
    font-size: 0.78rem;
    color: var(--link);
    text-decoration: none;
  }
  .wish-bought { opacity: 0.5; }

  /* Заметки */
  .note-card {
    background: var(--section-bg);
    border-radius: 12px;
    padding: 0.8rem 0.9rem;
    margin-bottom: 0.6rem;
  }
  .note-text {
    font-size: 0.9rem;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .note-photo {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 0.5rem;
    display: block;
  }
  .note-date {
    font-size: 0.72rem;
    color: var(--hint);
    margin-top: 0.4rem;
  }

  /* Аскезы/цели */
  .practice-card {
    background: var(--section-bg);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    margin-bottom: 0.7rem;
  }
  .practice-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .practice-title { font-size: 0.98rem; font-weight: 700; }
  .practice-type {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0.15em 0.55em;
    border-radius: 99px;
    background: var(--bg);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .practice-dates {
    font-size: 0.76rem;
    color: var(--hint);
    margin-top: 0.15rem;
  }
  .practice-intention {
    font-size: 0.82rem;
    font-style: italic;
    color: var(--hint);
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--rule);
  }
  .practice-items { margin-top: 0.6rem; }
  .practice-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0;
  }
  .pi-desc { font-size: 0.86rem; flex: 1; }
  .pi-target { font-size: 0.74rem; color: var(--hint); }
  .pi-progress {
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <header>
    <h1>Привет 👋</h1>
    <p id="subtitle">твой дашборд с Гарри</p>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="calendar">Календарь</button>
    <button class="tab" data-tab="food">Калории</button>
    <button class="tab" data-tab="plans">Планы</button>
    <button class="tab" data-tab="finance">Финансы</button>
    <button class="tab" data-tab="health">Вес</button>
    <button class="tab" data-tab="wishlist">Вишлист</button>
    <button class="tab" data-tab="notes">Заметки</button>
    <button class="tab" data-tab="practices">Аскезы</button>
  </div>
  <main id="content">
    <div class="loading"><div class="spinner"></div>Загружаю…</div>
  </main>

<script>
const API_BASE = ""; // served from the same origin as the API now
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

const EVENT_ICONS = {
  "врач": "🩺", "встреча": "🤝", "тренировка": "🏃", "холостая луна": "🌑",
  "день рождения": "🎂",
};
const RECUR_LABELS = { yearly: "ежегодно", monthly: "ежемесячно", weekly: "еженедельно", daily: "ежедневно" };
const WEEKDAY_SHORT = ["вс","пн","вт","ср","чт","пт","сб"];

function iconFor(type) { return EVENT_ICONS[type] || "📌"; }

function fmtDayLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  if (d.getTime() === today.getTime()) return "Сегодня";
  if (d.getTime() === tomorrow.getTime()) return "Завтра";
  return d.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
}
function fmtTime(datetimeStr) { return datetimeStr.slice(11, 16); }
function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

async function apiGet(path) {
  if (!initData) throw new Error("NO_INIT_DATA");
  const res = await fetch(API_BASE + path, { headers: { "X-Telegram-Init-Data": initData } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
async function apiPost(path) {
  const res = await fetch(API_BASE + path, {
    method: "POST",
    headers: { "X-Telegram-Init-Data": initData },
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function noAuthNotice() {
  return '<div class="error">Открой это через кнопку в Telegram-боте — напрямую в браузере данные не показать (нужна авторизация Telegram).</div>';
}

/* ---------- Календарь ---------- */
async function loadCalendar() {
  const content = document.getElementById("content");
  if (!initData) { content.innerHTML = noAuthNotice(); return; }
  try {
    const events = await apiGet("/api/calendar");
    renderCalendar(events);
  } catch (err) {
    content.innerHTML = '<div class="error">Не получилось загрузить: ' + err.message + '</div>';
  }
}

function renderCalendar(events) {
  const content = document.getElementById("content");
  if (!events.length) { content.innerHTML = '<div class="empty">Пока ничего нет в календаре</div>'; return; }

  const now = new Date();
  const upcoming = events.filter(e => new Date(e.event_datetime.replace(" ", "T")) >= now || e.is_recurring);
  const byDay = {};
  for (const e of upcoming) {
    const day = e.event_datetime.slice(0, 10);
    (byDay[day] ??= []).push(e);
  }
  const days = Object.keys(byDay).sort();

  let html = "";
  for (const day of days) {
    html += `<div class="day-group"><div class="day-label">${fmtDayLabel(day)}</div>`;
    for (const e of byDay[day]) {
      const recur = e.is_recurring && RECUR_LABELS[e.recurrence_rule]
        ? `<span class="recur-badge">· ${RECUR_LABELS[e.recurrence_rule]}</span>` : "";
      html += `
        <div class="event-card">
          <div class="event-icon">${iconFor(e.event_type)}</div>
          <div class="event-body">
            <div class="event-title">${escapeHtml(e.title)}</div>
            <div class="event-meta">${escapeHtml(e.event_type)}${recur}</div>
          </div>
          <div class="event-time">${fmtTime(e.event_datetime)}</div>
        </div>`;
    }
    html += `</div>`;
  }
  content.innerHTML = html;
}

/* ---------- Калории ---------- */
async function loadFood() {
  const content = document.getElementById("content");
  if (!initData) { content.innerHTML = noAuthNotice(); return; }
  try {
    const rows = await apiGet("/api/food-summary?days=7");
    renderFood(rows);
  } catch (err) {
    content.innerHTML = '<div class="error">Не получилось загрузить: ' + err.message + '</div>';
  }
}

function renderFood(rows) {
  const content = document.getElementById("content");
  const byDay = Object.fromEntries(rows.map(r => [r.day, r]));

  const todayStr = new Date().toISOString().slice(0, 10);
  const todayCals = byDay[todayStr]?.calories ?? 0;
  const daysWithData = rows.length || 1;
  const avg = Math.round(rows.reduce((s, r) => s + (r.calories || 0), 0) / daysWithData);

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const maxCal = Math.max(1, ...days.map(d => byDay[d]?.calories || 0));

  let bars = "";
  for (const day of days) {
    const cal = byDay[day]?.calories || 0;
    const h = Math.round((cal / maxCal) * 100);
    const wd = WEEKDAY_SHORT[new Date(day + "T00:00:00").getDay()];
    bars += `
      <div class="bar-col">
        <div class="bar-val">${cal ? cal : ""}</div>
        <div class="bar" style="height:${Math.max(h, cal ? 4 : 0)}%"></div>
        <div class="bar-day">${wd}</div>
      </div>`;
  }

  content.innerHTML = `
    <div class="stat-row">
      <div class="stat-tile"><div class="stat-value">${todayCals}</div><div class="stat-label">ккал сегодня</div></div>
      <div class="stat-tile"><div class="stat-value">${avg}</div><div class="stat-label">в среднем за неделю</div></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Калории за 7 дней</div>
      <div class="bars">${bars}</div>
    </div>`;
}

/* ---------- Планы ---------- */
async function loadPlans() {
  const content = document.getElementById("content");
  if (!initData) { content.innerHTML = noAuthNotice(); return; }
  try {
    const data = await apiGet("/api/plans");
    renderPlans(data);
  } catch (err) {
    content.innerHTML = '<div class="error">Не получилось загрузить: ' + err.message + '</div>';
  }
}

function planItemHtml(item) {
  const doneCls = item.done ? " done" : "";
  return `
    <button class="plan-item${doneCls}" data-id="${item.id}">
      <span class="plan-check">${item.done ? "✓" : ""}</span>
      <span class="plan-text">${escapeHtml(item.text)}</span>
    </button>`;
}

function renderPlans(data) {
  const content = document.getElementById("content");
  const dayHtml = data.day.length
    ? data.day.map(planItemHtml).join("")
    : '<div class="empty" style="padding:1.2rem;">Пусто — попроси Гарри записать план на сегодня</div>';
  const weekHtml = data.week.length
    ? data.week.map(planItemHtml).join("")
    : '<div class="empty" style="padding:1.2rem;">Пусто — попроси Гарри записать план на неделю</div>';

  content.innerHTML = `
    <div class="plan-section">
      <div class="plan-heading">Сегодня</div>
      ${dayHtml}
    </div>
    <div class="plan-section">
      <div class="plan-heading">На этой неделе</div>
      ${weekHtml}
    </div>`;

  content.querySelectorAll(".plan-item").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      const nowDone = !btn.classList.contains("done");
      btn.classList.toggle("done", nowDone);
      btn.querySelector(".plan-check").textContent = nowDone ? "✓" : "";
      tg?.HapticFeedback?.impactOccurred?.("light");
      try {
        await apiPost(`/api/plans/${id}/toggle`);
      } catch {
        btn.classList.toggle("done", !nowDone);
        btn.querySelector(".plan-check").textContent = !nowDone ? "✓" : "";
      }
    });
  });
}

/* ---------- Финансы ---------- */
async function loadFinance() {
  const content = document.getElementById("content");
  if (!initData) { content.innerHTML = noAuthNotice(); return; }
  try {
    const data = await apiGet("/api/finance-summary");
    renderFinance(data);
  } catch (err) {
    content.innerHTML = '<div class="error">Не получилось загрузить: ' + err.message + '</div>';
  }
}

const RUB = new Intl.NumberFormat("ru-RU");

function renderFinance(data) {
  const content = document.getElementById("content");
  const net = data.month_income - data.month_expense;
  const maxCat = Math.max(1, ...data.by_category.map(c => c.total));

  const catHtml = data.by_category.length
    ? data.by_category.map(c => `
        <div class="cat-row">
          <div class="cat-row-top">
            <span class="cat-name">${escapeHtml(c.category)}</span>
            <span class="cat-amount">${RUB.format(c.total)} ₽</span>
          </div>
          <div class="cat-track"><div class="cat-fill" style="width:${Math.round(c.total / maxCat * 100)}%"></div></div>
        </div>`).join("")
    : '<div class="empty" style="padding:1rem;">Трат в этом месяце пока нет</div>';

  const txnHtml = data.recent.length
    ? data.recent.map(t => {
        const sign = t.type === "доход" ? "+" : "−";
        const cls = t.type === "доход" ? "income" : "expense";
        const dateStr = t.logged_at.slice(0, 10);
        const meta = [t.merchant, dateStr].filter(Boolean).join(" · ");
        return `
          <div class="txn-row">
            <div class="txn-body">
              <div class="txn-cat">${escapeHtml(t.category || "без категории")}</div>
              <div class="txn-meta">${escapeHtml(meta)}</div>
            </div>
            <div class="txn-amount ${cls}">${sign}${RUB.format(t.amount)} ₽</div>
          </div>`;
      }).join("")
    : '<div class="empty" style="padding:1rem;">Пока пусто</div>';

  content.innerHTML = `
    <div class="stat-row">
      <div class="stat-tile income"><div class="stat-value">${RUB.format(data.month_income)}</div><div class="stat-label">доход в этом месяце</div></div>
      <div class="stat-tile expense"><div class="stat-value">${RUB.format(data.month_expense)}</div><div class="stat-label">расход в этом месяце</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-tile net"><div class="stat-value${net < 0 ? " negative" : ""}">${net >= 0 ? "+" : ""}${RUB.format(net)} ₽</div><div class="stat-label">баланс за месяц</div></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Расходы по категориям</div>
      ${catHtml}
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Последние операции</div>
      ${txnHtml}
    </div>`;
}

/* ---------- Вес/активность ---------- */
async function loadHealth() {
  const content = document.getElementById("content");

function weightLineChart(points) {
  if (!points.length) return '<div class="empty" style="padding:1rem;">Пока нет записей веса</div>';
  const W = 320, H = 130, PAD = 18;
  const values = points.map(p => p.weight_kg);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const step = points.length > 1 ? (W - PAD * 2) / (points.length - 1) : 0;

  const coords = points.map((p, i) => {
    const x = PAD + i * step;
    const y = H - PAD - ((p.weight_kg - min) / range) * (H - PAD * 2);
    return [x, y];
  });

  const linePath = coords.map(([x, y], i) => (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
  const fillPath = linePath + ` L${coords[coords.length - 1][0].toFixed(1)} ${H - PAD} L${coords[0][0].toFixed(1)} ${H - PAD} Z`;

  const dots = coords.map(([x, y], i) => {
    const isLast = i === coords.length - 1;
    return `<circle class="line-dot${isLast ? " last" : ""}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isLast ? 4.5 : 3}"></circle>`;
  }).join("");

  return `
    <svg class="line-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line class="line-grid" x1="${PAD}" y1="${H - PAD}" x2="${W - PAD}" y2="${H - PAD}"></line>
      <path class="line-fill" d="${fillPath}"></path>
      <path class="line-path" d="${linePath}"></path>
      ${dots}
    </svg>`;
}

function renderHealth(data) {
  const content = document.getElementById("content");
  const weight = data.weight;
  const latest = weight[weight.length - 1];
  const prev = weight.length > 1 ? weight[weight.length - 2] : null;
  const delta = prev ? Math.round((latest.weight_kg - prev.weight_kg) * 10) / 10 : null;
  const deltaStr = delta == null ? "" : (delta > 0 ? `+${delta}` : `${delta}`) + " кг с прошлой записи";

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const byDay = Object.fromEntries(data.activity.map(a => [a.day, a]));
  const maxSteps = Math.max(1, ...days.map(d => byDay[d]?.steps || 0));
  let stepBars = "";
  for (const day of days) {
    const steps = byDay[day]?.steps || 0;
    const h = Math.round((steps / maxSteps) * 100);
    const wd = WEEKDAY_SHORT[new Date(day + "T00:00:00").getDay()];
    stepBars += `
      <div class="bar-col">
        <div class="bar-val">${steps ? steps : ""}</div>
        <div class="bar" style="height:${Math.max(h, steps ? 4 : 0)}%"></div>
        <div class="bar-day">${wd}</div>
      </div>`;
  }
  const weekCalories = Math.round(data.activity.reduce((s, a) => s + (a.calories_burned || 0), 0));

  content.innerHTML = `
    <div class="stat-row">
      <div class="stat-tile"><div class="stat-value">${latest ? latest.weight_kg + " кг" : "—"}</div><div class="stat-label">${latest ? deltaStr || "последняя запись" : "нет записей"}</div></div>
      <div class="stat-tile"><div class="stat-value">${weekCalories}</div><div class="stat-label">ккал сожжено за неделю</div></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Динамика веса</div>
      ${weightLineChart(weight)}
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Шаги за 7 дней</div>
      <div class="bars steps-bars">${stepBars}</div>
    </div>`;
}

/* ---------- Вишлист ---------- */
async function loadWishlist() {
  const content = document.getElementById("content");
  if (!initData) { content.innerHTML = noAuthNotice(); return; }
  try {
    const items = await apiGet("/api/wishlist");
    renderWishlist(items);
  } catch (err) {
    content.innerHTML = '<div class="error">Не получилось загрузить: ' + err.message + '</div>';
  }
}

function renderWishlist(items) {
  const content = document.getElementById("content");
  if (!items.length) { content.innerHTML = '<div class="empty">Вишлист пока пуст</div>'; return; }

  const cards = items.map(w => {
    const bought = w.status !== "active";
    const photo = w.photo_url
      ? `<img class="wish-photo" src="${API_BASE}${w.photo_url}" alt="">`
      : `<div class="wish-photo-empty">🎁</div>`;
    const link = w.url ? `<a class="wish-link" href="${w.url}" target="_blank" rel="noopener">Открыть →</a>` : "";
    const price = w.price ? `<div class="wish-price">${escapeHtml(w.price)}</div>` : "";
    const priority = w.priority ? `<span class="wish-priority">${escapeHtml(w.priority)}</span>` : "";
    return `
      <div class="wish-card${bought ? " wish-bought" : ""}">
        ${photo}
        <div class="wish-body">
          <div class="wish-title">${escapeHtml(w.title)}</div>
          ${price}
          ${priority}
          ${link}
        </div>
      </div>`;
  }).join("");

  content.innerHTML = `<div class="wish-grid">${cards}</div>`;
}

  const content = document.getElementById("content");

function renderNotes(items) {
  const content = document.getElementById("content");
  if (!items.length) { content.innerHTML = '<div class="empty">Заметок пока нет</div>'; return; }

  content.innerHTML = items.map(n => {
    const photo = n.photo_url ? `<img class="note-photo" src="${API_BASE}${n.photo_url}" alt="">` : "";
    const date = new Date(n.created_at.replace(" ", "T")).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
    return `
      <div class="note-card">
        <div class="note-text">${escapeHtml(n.text)}</div>
        ${photo}
        <div class="note-date">${date}</div>
      </div>`;
  }).join("");
}

function renderPractices(practicesList) {
  const content = document.getElementById("content");
  if (!practicesList.length) { content.innerHTML = '<div class="empty">Нет активных аскез/целей</div>'; return; }

  content.innerHTML = practicesList.map(p => {
    const itemsHtml = p.items.map(it => `
      <div class="practice-item-row">
        <div>
          <div class="pi-desc">${escapeHtml(it.description)}</div>
          ${it.target ? `<div class="pi-target">${escapeHtml(it.target)}</div>` : ""}
        </div>
        <div class="pi-progress">${it.done_count}/${it.total_logged || 0}</div>
      </div>`).join("");
    const intention = p.intention ? `<div class="practice-intention">🌌 ${escapeHtml(p.intention)}</div>` : "";
    const endStr = p.end_date ? new Date(p.end_date + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) : "";
    return `
      <div class="practice-card">
        <div class="practice-top">
          <div>
            <div class="practice-title">${escapeHtml(p.title)}</div>
            <div class="practice-dates">до ${endStr}</div>
          </div>
          <span class="practice-type">${escapeHtml(p.type)}</span>
        </div>
        <div class="practice-items">${itemsHtml}</div>
        ${intention}
      </div>`;
  }).join("");
}

});
